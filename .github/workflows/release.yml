name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # match the runtime of Fission's python environment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # branches and pull requests only prove the build works; tags publish it
      - name: Build
        run: ./build.sh "${GITHUB_REF_NAME//\//-}"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
