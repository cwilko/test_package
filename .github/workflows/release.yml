name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

# serialise runs so two quick pushes can't race while old dev pre-releases are pruned
concurrency:
  group: release
  cancel-in-progress: false

env:
  # how many dev-<sha> pre-releases to keep; older ones are deleted (with their tags) after each new one is published
  KEEP_DEV_RELEASES: 5
  # public base URL the function is served from; goes in the servers block of the published openapi.yaml
  API_BASE_URL: https://api.squirrelhome.co.uk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # match the runtime of Fission's python environment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # v* tag  -> release v1.2.3
      # main    -> development pre-release dev-<short sha>
      # other   -> ci-<short sha>, build only (pull requests)
      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh "$VERSION"

      # a Fission deployment manifest for the zip above
      - name: Build Fission package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/build-fission-package.sh "$VERSION"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      - name: Publish development pre-release and prune old ones
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --prerelease --title "$VERSION" \
            --notes "Development build of $GITHUB_SHA"
          ./.github/scripts/prune-dev-releases.sh "$KEEP_DEV_RELEASES"
