# OpenAPI document for the test-package function. A plain Fission function has no HTTP contract of its own: the method and
# path come from the HTTPTrigger in package.yaml.tmpl, so this spec lives next to that template and is published with each
# release as the openapi.yaml asset (the trigger's catalog.squirrelhome.co.uk/openapi annotation holds its URL).
# __NAME__ and __SERVER_URL__ are filled in by .github/scripts/build-fission-package.sh (the server URL is API_BASE_URL,
# set in release.yml), so this file is a template and not valid OpenAPI until rendered.
openapi: 3.0.3

info:
  title: __NAME__
  version: 1.0.0
  description: >
    Demo function deployed from a pre-built package. Returns a one-line plain-text message with the Python version it
    runs on and a size formatted by the vendored humanize library (1234567890 bytes), plus the path humanize was loaded
    from, which shows where the package code was unpacked. The function scales to zero when idle, so the first request
    after a quiet period is a cold start of about 2-3 seconds.

servers:
  - url: __SERVER_URL__

paths:
  /__NAME__:
    get:
      operationId: getTestPackage
      summary: Get the package's status line
      description: Takes no parameters and no body.
      responses:
        "200":
          description: Plain-text line with the Python version, a humanize-formatted size and the humanize module path.
          content:
            text/plain:
              schema:
                type: string
              # The module path in the parentheses depends on where the fetcher unpacks the package, so it is illustrative.
              example: "test-package on python 3.12: 1234567890 bytes is 1.2 GB (humanize from /userfunc/deployarchive/humanize/__init__.py)\n"
